name: Lunar Paper Digest

on:
  schedule:
    # UTC 00:00 = Asia/Shanghai 08:00; Actions can start late.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only saves a report; send also emails it'
        type: choice
        options:
          - preview
          - send
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: lunar-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      DIGEST_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      SENDER_PASS: ${{ secrets.SENDER_PASS }}
      SMTP_SERVER: smtp.163.com
      SMTP_PORT: '465'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
      MODEL: ${{ secrets.MODEL }}
      LOOKBACK_DAYS: '7'
      MAX_PAPERS: '5'
      REQUEST_TIMEOUT: '45'
      LLM_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install digest dependencies
        run: python -m pip install -r requirements-digest.txt
      - name: Restore delivered-paper IDs
        id: history
        uses: actions/cache/restore@v4
        with:
          path: .digest-state
          key: lunar-digest-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lunar-digest-v1-
      - name: Retrieve papers and prepare or send digest
        run: python src/lunar_digest.py
      - name: Save delivered-paper IDs after successful email
        if: success() && env.DIGEST_MODE == 'send'
        uses: actions/cache/save@v4
        with:
          path: .digest-state
          key: lunar-digest-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: digest-output/
          if-no-files-found: ignore
          retention-days: 14
